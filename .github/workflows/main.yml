name: Build PDF Air for iPad

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Unpack PDF Air
        run: |
          z=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$z" ]; then rm -rf pdf-air-ipad && unzip -q -o "$z"; fi
          if [ ! -d pdf-air-ipad/site ] && [ -d site ]; then mkdir -p pdf-air-ipad && cp -r site prepare-web.ps1 pdf-air-ipad/; fi
          echo "Files in this repository:"; ls -la
          if [ ! -d pdf-air-ipad/site ]; then echo "::error title=PDF Air files not found::Upload pdf-air-ipad.zip (not unzipped) to this repository, then run this again."; exit 1; fi

      - name: Build in the offline files
        shell: pwsh
        run: ./pdf-air-ipad/prepare-web.ps1 -Site pdf-air-ipad/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: pdf-air-ipad/site

      - name: Publish the iPad app
        id: deploy
        uses: actions/deploy-pages@v4
