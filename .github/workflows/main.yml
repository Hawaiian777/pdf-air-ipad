name: Build PDF Air for iPad

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack PDF Air
        run: |
          if [ -f pdf-air-ipad.zip ]; then rm -rf pdf-air-ipad && unzip -q pdf-air-ipad.zip; fi
          if [ ! -d pdf-air-ipad/site ]; then echo "Upload pdf-air-ipad.zip to this repository first."; exit 1; fi

      - name: Build in the offline files
        shell: pwsh
        run: ./pdf-air-ipad/prepare-web.ps1 -Site pdf-air-ipad/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pdf-air-ipad/site

      - name: Publish the iPad app
        id: deploy
        uses: actions/deploy-pages@v4
